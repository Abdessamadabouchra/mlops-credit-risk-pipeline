name: mlops-credit-risk

# One shared network with a fixed name (Airflow's DockerOperator joins it to run Spark jobs)
networks:
  default:
    name: mlops-net

x-common-env: &common-env
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ROOT_USER: ${MINIO_ROOT_USER}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  MLFLOW_S3_ENDPOINT_URL: http://minio:9000
  MLFLOW_TRACKING_URI: http://mlflow:5000
  KAFKA_BOOTSTRAP: kafka:9092
  KAFKA_TOPIC: credit_applications
  SPARK_MASTER_URL: spark://spark-master:7077
  PROMOTION_TOLERANCE: ${PROMOTION_TOLERANCE}
  MIN_NEW_DATA_RATIO: ${MIN_NEW_DATA_RATIO}

# Custom image built on top of apache/spark (jars: S3A, Kafka, Delta + python libs + our code)
x-spark-build: &spark-build
  context: .
  dockerfile: docker/spark/Dockerfile

services:
  # ---------------------------------------------------------------- Kafka (KRaft, no Zookeeper)
  kafka:
    image: apache/kafka:4.0.1
    pull_policy: never
    container_name: mlops-kafka
    ports:
      - "${KAFKA_EXTERNAL_PORT}:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      # without this the apache/kafka image writes to /tmp/kafka-logs INSIDE the container: messages are lost
      # every time the container is recreated (stop.ps1 / start.ps1)
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.0.1
    pull_policy: never
    container_name: mlops-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
      --topic credit_applications --partitions 3 --replication-factor 1
    restart: "no"

  # ---------------------------------------------------------------- MinIO (data lake + MLflow artifacts)
  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    pull_policy: never
    container_name: mlops-minio
    user: "0:0"   # the image's default user 'minio' cannot write to a fresh named volume
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # creates the buckets: lake, mlflow, dvc, checkpoints
  minio-init:
    image: mlops-spark:1.0
    pull_policy: never
    container_name: mlops-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment: *common-env
    command: ["python3", "/opt/jobs/init_buckets.py"]
    restart: "no"

  # ---------------------------------------------------------------- Postgres (MLflow + Airflow metadata)
  postgres:
    image: postgres:16
    pull_policy: never
    container_name: mlops-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ---------------------------------------------------------------- Spark standalone: 1 master + 1 worker
  spark-master:
    image: mlops-spark:1.0
    build: *spark-build
    container_name: mlops-spark-master
    environment: *common-env
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master",
              "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    ports:
      - "${SPARK_UI_PORT}:8080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 10

  # The ONLY worker. Do not scale it.
  spark-worker:
    image: mlops-spark:1.0
    pull_policy: never
    container_name: mlops-spark-worker
    depends_on:
      spark-master:
        condition: service_healthy
    environment: *common-env
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
              "--host", "spark-worker", "--webui-port", "8081",
              "--cores", "${SPARK_WORKER_CORES}", "--memory", "${SPARK_WORKER_MEMORY}",
              "--work-dir", "/opt/spark/work-dir", "spark://spark-master:7077"]
    ports:
      - "${SPARK_WORKER_UI_PORT}:8081"

  # ---------------------------------------------------------------- MLflow (tracking + registry, artifacts -> MinIO)
  mlflow:
    image: mlops-spark:1.0
    pull_policy: never
    container_name: mlops-mlflow
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment: *common-env
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--workers", "1",
              "--backend-store-uri", "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/mlflow",
              "--artifacts-destination", "s3://mlflow/", "--serve-artifacts"]
    ports:
      - "${MLFLOW_PORT}:5000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # ---------------------------------------------------------------- Producer: synthetic credit applications -> Kafka
  generator:
    image: mlops-spark:1.0
    pull_policy: never
    container_name: mlops-generator
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      <<: *common-env
      EVENTS_PER_SEC: ${EVENTS_PER_SEC}
      MAX_DATA_MB: ${MAX_DATA_MB}
    user: "0:0"   # writes its byte counter to the generator_state volume
    volumes:
      - generator_state:/state
    command: ["python3", "/opt/generator/producer.py"]
    restart: on-failure   # exits 0 once MAX_DATA_MB is reached, so it is not restarted

  # ---------------------------------------------------------------- Streaming jobs (long-running, 1 core each)
  stream-bronze:
    image: mlops-spark:1.0
    pull_policy: never
    container_name: mlops-stream-bronze
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      spark-worker:
        condition: service_started
    environment: *common-env
    command: ["/opt/jobs/submit.sh", "kafka_to_bronze.py", "1", "512m", "512m"]
    restart: on-failure

  # bronze -> silver is NOT a permanent service: it is an incremental batch job (first task of the Airflow DAG)

  # ---------------------------------------------------------------- Airflow (runs batch Spark jobs through DockerOperator)
  airflow:
    image: mlops-airflow:1.0
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    container_name: mlops-airflow
    user: "50000:0"
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment:
      <<: *common-env
      HOST_PROJECT_DIR: ${HOST_PROJECT_DIR:-}   # set by start.ps1; lets the dvc_snapshot task mount the project
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: mlops-demo-secret-key
      AIRFLOW__WEBSERVER__WORKERS: 1
      AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: 300   # slow first start on a busy 8 GB machine
      AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: 300
      AIRFLOW__SCHEDULER__PARSING_PROCESSES: 1
      # small machine: DB heartbeats can stall for a minute while Spark uses all cores - don't kill running tasks for that
      AIRFLOW__SCHEDULER__TASK_INSTANCE_HEARTBEAT_TIMEOUT: 3600
      AIRFLOW__SCHEDULER__SCHEDULER_ZOMBIE_TASK_THRESHOLD: 3600
      AIRFLOW__SCHEDULER__JOB_HEARTBEAT_SEC: 30
    command: >
      bash -c "airflow db migrate &&
      (airflow users create --username ${AIRFLOW_ADMIN_USER} --password ${AIRFLOW_ADMIN_PASSWORD}
      --firstname Admin --lastname User --role Admin --email admin@example.com || true);
      airflow scheduler & exec airflow webserver"
    ports:
      - "${AIRFLOW_PORT}:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - airflow_logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    restart: on-failure

  # ---------------------------------------------------------------- DVC: version the gold snapshot (run on demand)
  # Not started by 'up': run  .\dvc_snapshot.ps1   (= docker compose run --rm dvc)
  dvc:
    image: mlops-spark:1.0
    pull_policy: never
    container_name: mlops-dvc
    profiles: ["tools"]
    user: "0:0"
    depends_on:
      minio-init:
        condition: service_completed_successfully
      spark-worker:
        condition: service_started
    environment: *common-env
    volumes:
      - .:/project
    command: ["/opt/jobs/dvc_snapshot.sh"]
    restart: "no"

  # ---------------------------------------------------------------- Model serving API
  api:
    image: mlops-spark:1.0
    pull_policy: never
    container_name: mlops-api
    depends_on:
      mlflow:
        condition: service_healthy
    environment: *common-env
    command: ["python3", "-m", "uvicorn", "main:app", "--app-dir", "/opt/api", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${API_PORT}:8000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: on-failure

  # ---------------------------------------------------------------- Web UI (Streamlit) calling the API
  ui:
    image: mlops-spark:1.0
    pull_policy: never
    container_name: mlops-ui
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:8000
      HOME: /tmp                                 # streamlit writes its config under $HOME
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    command: ["streamlit", "run", "/opt/ui/app.py", "--server.port", "8501", "--server.address", "0.0.0.0",
              "--server.headless", "true"]
    ports:
      - "${UI_PORT}:8501"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8501/_stcore/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: on-failure

  # ---------------------------------------------------------------- Kafka UI (topics, messages, consumer groups)
  kafka-ui:
    image: kafbat/kafka-ui:v1.0.0
    pull_policy: never
    container_name: mlops-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: mlops-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "false"
      JAVA_OPTS: "-Xms128m -Xmx256m"
    ports:
      - "${KAFKA_UI_PORT}:8080"
    restart: on-failure

volumes:
  kafka_data:
  minio_data:
  pg_data:
  airflow_logs:
  generator_state:
