# Credit-risk serving on Kubernetes (minikube): API (FastAPI + baked champion model) and web UI (Streamlit).
# __IMAGE_TAG__ is replaced by k8s/deploy.ps1 with the model version, e.g. v3.
apiVersion: v1
kind: Namespace
metadata:
  name: credit-risk
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: credit-risk-config
  namespace: credit-risk
data:
  API_URL: "http://credit-risk-api:8000"
  STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: credit-risk-api
  namespace: credit-risk
  labels: {app: credit-risk-api}
spec:
  replicas: 1
  selector:
    matchLabels: {app: credit-risk-api}
  template:
    metadata:
      labels: {app: credit-risk-api, model-version: "__IMAGE_TAG__"}
    spec:
      containers:
        - name: api
          image: credit-risk-serving:__IMAGE_TAG__
          imagePullPolicy: Never          # image loaded into minikube by deploy.ps1, never pulled
          command: ["python3", "-m", "uvicorn", "main:app", "--app-dir", "/opt/api",
                    "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          env:
            - name: HOME
              value: /tmp
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "2", memory: 2Gi}
          readinessProbe:                 # traffic only once the model is loaded (Spark start + model load)
            httpGet: {path: /ready, port: 8000}
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:                  # restart the pod if the process stops answering
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: credit-risk-api
  namespace: credit-risk
spec:
  selector: {app: credit-risk-api}
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: credit-risk-ui
  namespace: credit-risk
  labels: {app: credit-risk-ui}
spec:
  replicas: 1
  selector:
    matchLabels: {app: credit-risk-ui}
  template:
    metadata:
      labels: {app: credit-risk-ui}
    spec:
      containers:
        - name: ui
          image: credit-risk-serving:__IMAGE_TAG__
          imagePullPolicy: Never
          command: ["streamlit", "run", "/opt/ui/app.py", "--server.port", "8501",
                    "--server.address", "0.0.0.0", "--server.headless", "true"]
          ports:
            - containerPort: 8501
          envFrom:
            - configMapRef: {name: credit-risk-config}
          env:
            - name: HOME
              value: /tmp
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe:
            httpGet: {path: /_stcore/health, port: 8501}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /_stcore/health, port: 8501}
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: credit-risk-ui
  namespace: credit-risk
spec:
  type: NodePort
  selector: {app: credit-risk-ui}
  ports:
    - port: 8501
      targetPort: 8501
      nodePort: 30851
